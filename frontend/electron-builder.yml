appId: io.majo.desktop
productName: Majo Desktop
directories:
  output: ../desktop-dist
files:
  - electron/**
extraResources:
  - from: local-binaries/binaries/jre
    to: binaries/jre
  - from: local-binaries/binaries/majo-backend.jar
    to: binaries/majo-backend.jar
  - from: ../scripts/pack-electron/icons/icon.png
    to: icon.png
  - from: dist-desktop-bootstrap
    to: dist-desktop-bootstrap
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
