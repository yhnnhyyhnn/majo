<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" fill="none">
  <!-- Tile shadow -->
  <rect x="16" y="20" width="256" height="256" rx="28" fill="rgba(0,0,0,0.15)" />
  <!-- Tile body -->
  <rect x="12" y="16" width="256" height="256" rx="28" fill="#F5F0E8" stroke="#2D8B4E" stroke-width="4" />
  <!-- Inner border -->
  <rect x="28" y="32" width="224" height="224" rx="20" stroke="#2D8B4E" stroke-width="1.5" opacity="0.5" />
  <!-- Green top accent bar -->
  <rect x="12" y="16" width="256" height="48" rx="28" fill="#2D8B4E" />
  <rect x="12" y="40" width="256" height="24" fill="#2D8B4E" />
  <!-- 發 character in green -->
  <text x="144" y="196" text-anchor="middle" fill="#1A6B35" font-size="120" font-family="serif" font-weight="bold">發</text>
</svg>
